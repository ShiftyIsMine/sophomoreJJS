<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
  <title>관계 매핑ㅇㅇㅇㅇ</title>
</head>
<body>
  <div align="center">
    <h3>JPA 데베</h3>
    <h2>product </h2>
    <table border="1" cellpadding="10">
      <tr>
        <th>아이디</th>
        <th>제품명</th>
        <th>가  격</th>
      </tr>
      <tr th:each="product:${productList}">
        <td th:text ="${product.id}"></td>
        <td th:text ="${product.name}"></td>
        <td th:text ="${product.price}"></td>
      </tr>
    </table>
    <br>
    <h2>Detaiaiaial</h2>
    <table border="1" cellpadding="10">
      <tr>
        <th>아이디</th>
        <th>서얼명</th>
        <th>무게</th>
        <th>가로</th>
        <th>세로</th>
      </tr>
      <tr th:each="detail:${detailList}">
        <td th:text ="${detail.id}"></td>
        <td th:text ="${detail.description}"></td>
        <td th:text ="${detail.weight}"></td>
        <td th:text ="${detail.width}"></td>
        <td th:text ="${detail.height}"></td>
      </tr>
    </table>
  </div>
</body>
</html>
